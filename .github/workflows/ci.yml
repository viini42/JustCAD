name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: clang-format-18 --dry-run --Werror include/jcad/*/*.hpp src/*.cpp tests/*.cpp

  build:
    name: ${{ matrix.os }} / ${{ matrix.cxx }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cxx: g++-13 }
          - { os: ubuntu-24.04, cxx: clang++-18 }
          - { os: windows-2022, cxx: cl }
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: cmake --workflow --preset dev
