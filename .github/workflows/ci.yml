name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cxx }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cxx: g++-13 }
          - { os: ubuntu-24.04, cxx: clang++-18 }
          - { os: windows-2022, cxx: cl }
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.cxx }}" = "cl" ]; then
            cmake -S . -B build -DJUSTCAD_WARNINGS_AS_ERRORS=ON
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DJUSTCAD_WARNINGS_AS_ERRORS=ON
          fi

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure
