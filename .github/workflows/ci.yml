name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: clang-format-18 --dry-run --Werror include/jcad/*/*.hpp src/*.cpp tests/*.cpp

  build:
    name: ${{ matrix.os }} / ${{ matrix.cxx }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cxx: g++-13, cxxflags: "" }
          # Clang 18 cannot use libstdc++'s <expected>, so it builds against libc++.
          - { os: ubuntu-24.04, cxx: clang++-18, cxxflags: "-stdlib=libc++" }
          - { os: windows-2022, cxx: cl, cxxflags: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev
          if [ "${{ matrix.cxx }}" = "clang++-18" ]; then
            sudo apt-get install -y libc++-18-dev libc++abi-18-dev
          fi

      - name: Build and test
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
          CXXFLAGS: ${{ matrix.cxxflags }}
        run: cmake --workflow --preset dev
